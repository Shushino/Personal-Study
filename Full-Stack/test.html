<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Ticker</title>
    <link rel="stylesheet" href="test.css">
    <script src="test.js" defer></script>
</head>
<body>
    <main class="ticker">
        <p class="eyebrow">Market simulation</p>
        <h1>Stock Ticker</h1>

        <section class="stock-card" aria-label="Stock information" aria-live="polite">
            <dl>
                <div class="stock-row">
                    <dt>Name:</dt>
                    <dd id="stock-name"></dd>
                </div>
                <div class="stock-row">
                    <dt>Symbol:</dt>
                    <dd id="stock-symbol"></dd>
                </div>
                <div class="stock-row">
                    <dt>Price:</dt>
                    <dd class="price">
                        <span id="stock-price"></span>
                        <span id="price-trend" class="price-trend" aria-label="No change">▶</span>
                    </dd>
                </div>
                <div class="stock-row">
                    <dt>Time:</dt>
                    <dd><time id="stock-time"></time></dd>
                </div>
            </dl>
        </section>

        <p class="update-note">Price refreshes every 1.5 seconds</p>
    </main>
</body>
</html>
